name: Revisar sitios públicos
on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 4'
    - cron: '0 15 1 * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - id: cadence
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import date
          import os
          initial = date.today() <= date(2026, 12, 12)
          weekly = os.environ['SCHEDULE'] == '0 15 * * 4'
          due = os.environ['EVENT'] == 'workflow_dispatch' or initial == weekly
          print('run=' + str(due).lower())
          PY
      - uses: actions/checkout@v6
        if: steps.cadence.outputs.run == 'true'
      - name: Comprobar redirecciones, sitemaps y privacidad
        if: steps.cadence.outputs.run == 'true'
        run: python3 scripts/audit_sites.py --output search-health.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.cadence.outputs.run == 'true'
        with:
          name: search-health
          path: search-health.json
          retention-days: 30
